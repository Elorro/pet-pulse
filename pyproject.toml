[project]
name = "pet-pulse"
version = "0.1.0"
description = "Red social para mascotas con reconocimiento biométrico en el dispositivo móvil"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "MIT" }
authors = [{ name = "Equipo Pet Pulse", email = "dev@social-network.local" }]
dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.2.1,<3.0",
    "email-validator>=2.1.0,<3.0",
    "sqlalchemy[asyncio]>=2.0.29,<3.0",
    "asyncpg>=0.29.0,<1.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "alembic>=1.13.0,<2.0",
    "pgvector>=0.3.0,<1.0",
    "python-dotenv>=1.0.1,<2.0",
    "pyjwt[crypto]>=2.9.0,<3.0",
    "supabase>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Migraciones generadas por Alembic: se revisan a mano, no se reformatean.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: `Depends(...)` en valores por defecto es el patrón oficial de FastAPI.
ignore = ["B008"]

[tool.poetry]
name = "pet-pulse"
version = "0.1.0"
description = "Red social para mascotas con reconocimiento biométrico en el dispositivo móvil"
authors = ["Equipo Pet Pulse <dev@social-network.local>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "^0.110.0"
uvicorn = { extras = ["standard"], version = "^0.29.0" }
pydantic = "^2.6.0"
pydantic-settings = "^2.2.1"
email-validator = "^2.1.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.29" }
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.0"
pgvector = "^0.3.0"
python-dotenv = "^1.0.1"
pyjwt = { version = "^2.9.0", extras = ["crypto"] }

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
aiosqlite = "^0.20.0"
ruff = "^0.4.0"
mypy = "^1.9.0"
pre-commit = "^3.7.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
